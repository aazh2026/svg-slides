<rect x="560" y="150" width="1" height="46" rx="0" fill="#dde1e5"/>
<rect x="864" y="150" width="1" height="46" rx="0" fill="#dde1e5"/>
<rect x="60" y="161" width="24" height="24" rx="2" fill="#0070c0"/>
<text x="72" y="178" font-family="微软雅黑, Noto Sans CJK SC" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="94" y="177.55" font-family="微软雅黑, Noto Sans CJK SC" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">客户识别与增长机会发现</text>
<text x="296" y="177.55" font-family="微软雅黑, Noto Sans CJK SC" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">客户数据分散、画像不准、交叉销售靠经验</text>
<text x="572" y="177.55" font-family="微软雅黑, Noto Sans CJK SC" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">多系统客户主数据不一致、行为数据未打通</text>
<text x="876" y="177.55" font-family="微软雅黑, Noto Sans CJK SC" font-size="13" font-weight="700" fill="#c00000" text-anchor="start">缺少统一客户标识与跨域语义</text>
<rect x="48" y="196" width="1184" height="46" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<rect x="48" y="196" width="236" height="46" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1"/>
