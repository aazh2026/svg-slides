<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<title>从经营结果出发，识别十大业务问题的根本约束</title>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff"/>
<text x="48" y="64" font-family="微软雅黑, Noto Sans CJK SC" font-size="28" font-weight="700" fill="#c00000" text-anchor="start">从经营结果出发，识别十大业务问题的根本约束</text>
<text x="48" y="86" font-family="微软雅黑, Noto Sans CJK SC" font-size="13.33" font-weight="400" fill="#60666d" text-anchor="start">业务问题 → 表象 → 直接原因 → 根本约束：从业务反推技术竞争力，而非从技术寻找场景</text>
<rect x="48" y="98" width="1184" height="4" rx="0" fill="#c00000"/>
<rect x="48" y="118" width="1184" height="32" rx="0" fill="#303338"/>
<text x="60" y="139" font-family="微软雅黑, Noto Sans CJK SC" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">业务问题</text>
<text x="296" y="139" font-family="微软雅黑, Noto Sans CJK SC" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">表象</text>
<text x="572" y="139" font-family="微软雅黑, Noto Sans CJK SC" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">直接原因</text>
<text x="876" y="139" font-family="微软雅黑, Noto Sans CJK SC" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">根本约束</text>
<rect x="48" y="150" width="1184" height="46" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1"/>
<rect x="48" y="150" width="236" height="46" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1"/>
<rect x="864" y="150" width="368" height="46" rx="0" fill="#fceff0" stroke="#dde1e5" stroke-width="1"/>
