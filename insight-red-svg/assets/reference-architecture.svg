<text x="421.0" y="297" font-family="微软雅黑" font-size="14" font-weight="700" fill="#0070c0" text-anchor="middle">Agent / MCP / LLM</text>
<text x="421.0" y="317" font-family="微软雅黑" font-size="11.5" font-weight="400" fill="#24292f" text-anchor="middle">转换为对应规范</text>
<rect x="550" y="275" width="230" height="65" rx="5" fill="#ffffff" stroke="#dde1e5" stroke-width="1"/>
