<text x="177.0" y="297" font-family="微软雅黑" font-size="14" font-weight="700" fill="#0070c0" text-anchor="middle">Agent Network</text>
<text x="177.0" y="317" font-family="微软雅黑" font-size="11.5" font-weight="400" fill="#24292f" text-anchor="middle">YAML 版本化资产</text>
