<text x="168.0" y="412" font-family="微软雅黑" font-size="11.5" font-weight="400" fill="#24292f" text-anchor="middle">资产发现、版本与复用</text>
<rect x="302.0" y="370" width="240.0" height="77" rx="5" fill="#eff5fb" stroke="#dde1e5" stroke-width="1"/>
<text x="422.0" y="392" font-family="微软雅黑" font-size="14" font-weight="700" fill="#0070c0" text-anchor="middle">CloudHub 2.0</text>
<text x="422.0" y="412" font-family="微软雅黑" font-size="11.5" font-weight="400" fill="#24292f" text-anchor="middle">Broker 应用部署</text>
<rect x="556.0" y="370" width="240.0" height="77" rx="5" fill="#fceff0" stroke="#dde1e5" stroke-width="1"/>
<text x="676.0" y="392" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="middle">Flex Gateway</text>
<text x="676.0" y="412" font-family="微软雅黑" font-size="11.5" font-weight="400" fill="#24292f" text-anchor="middle">配置声明的策略</text>
<rect x="48" y="462" width="748" height="67" rx="5" fill="#f3f0fb" stroke="#dde1e5" stroke-width="1"/>
<text x="60" y="483" font-family="微软雅黑" font-size="14" font-weight="700" fill="#6b5b95" text-anchor="start">Agent Fabric 四项能力</text>
<text x="60" y="503" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">Discover · Orchestrate · Govern · Observe</text>
<rect x="48" y="543" width="748" height="53" rx="5" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<text x="60" y="564" font-family="微软雅黑" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">SDLC：环境准备 → 设计 → 构建发布 → 部署 / 环境晋级</text>
<rect x="820" y="151" width="412" height="137" rx="8" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<rect x="820" y="151" width="3.2" height="137" rx="0" fill="#c00000"/>
<text x="834" y="175" font-family="微软雅黑" font-size="14.67" font-weight="700" fill="#24292f" text-anchor="start">01  定义本身是工程资产</text>
<text x="834" y="197" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">YAML 表达网络连接及运行规则。</text>
<text x="834" y="216" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">网络定义与实际执行环境解耦。</text>
<text x="834" y="235" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">发布后的网络可被查询、版本化与复用。</text>
<rect x="820" y="300" width="412" height="126" rx="8" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<rect x="820" y="300" width="3.2" height="126" rx="0" fill="#c00000"/>
<text x="834" y="324" font-family="微软雅黑" font-size="14.67" font-weight="700" fill="#24292f" text-anchor="start">02  不是仅靠运行时动态发现</text>
<text x="834" y="346" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">未注册资产可在 YAML 中声明并注册。</text>
<text x="834" y="365" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">Broker 引用已定义或注册的资产。</text>
<text x="834" y="384" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">四项 Fabric 能力可以独立采用。</text>
<rect x="820" y="438" width="412" height="158" rx="8" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<rect x="820" y="438" width="3.2" height="158" rx="0" fill="#c00000"/>
<text x="834" y="462" font-family="微软雅黑" font-size="14.67" font-weight="700" fill="#24292f" text-anchor="start">03  企业 IT 建设建议</text>
<text x="834" y="484" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">统一 Agent Network 描述契约。</text>
<text x="834" y="503" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">将依赖、策略和环境配置纳入版本治理。</text>
<text x="834" y="522" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">验证构建、环境晋级与回滚的一致性。</text>
<text x="834" y="541" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">不必要求所有 Agent 使用同一引擎。</text>
<text x="48" y="610" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#70757c" text-anchor="start">来源：Salesforce Architects｜MuleSoft Agent Fabric - Deep Dive｜Specification / SDLC（依据正文逻辑重绘）</text>
<rect x="48" y="620" width="1184" height="56" rx="4" fill="#fceff0"/>
<rect x="48" y="620" width="3.2" height="56" rx="0" fill="#c00000"/>
<text x="62" y="643" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">启示：</text>
<text x="116" y="643" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">把 Agent 网络定义为可版本化、可部署的工程资产，而非在运行时临时拼接工具与 Agent。</text>
</svg>