<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<title>研发费用优化应优先消除成本源，而非压缩研发预算</title>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff"/>
<text x="48" y="64" font-family="微软雅黑" font-size="28" font-weight="700" fill="#c00000" text-anchor="start">研发费用优化应优先消除成本源，而非压缩研发预算</text>
<text x="48" y="86" font-family="微软雅黑" font-size="13.33" font-weight="400" fill="#60666d" text-anchor="start">专题十二  |  建议：以可归因、可验证的全生命周期净收益为目标，系统性改变成本结构</text>
<rect x="48" y="98" width="1184" height="4" rx="0" fill="#c00000"/>
<text x="48" y="137" font-family="微软雅黑" font-size="16" font-weight="700" fill="#24292f" text-anchor="start">四层降本策略：按优先级改变成本结构</text>
<text x="820" y="137" font-family="微软雅黑" font-size="16" font-weight="700" fill="#24292f" text-anchor="start">收益核算纪律与风险边界</text>
<rect x="48" y="151" width="748" height="30" rx="0" fill="#303338"/>
<text x="60" y="171" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">优先顺序</text>
<text x="166" y="171" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">主要手段</text>
<text x="432" y="171" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">典型收益</text>
<text x="615" y="171" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">风险与代价</text>
<rect x="48" y="181" width="748" height="56" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1"/>
<rect x="48" y="181" width="106" height="56" rx="0" fill="#fceff0"/>
<rect x="48" y="181" width="3.2" height="56" rx="0" fill="#c00000"/>
<text x="60" y="214" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">01  消除</text>
<rect x="154" y="181" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="166" y="204" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">退役低价值系统、合并重复平台</text>
<text x="166" y="221" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">取消闲置许可</text>
<rect x="420" y="181" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="432" y="214" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">现金支出直接减少</text>
<rect x="603" y="181" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="615" y="204" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">业务中断</text>
<text x="615" y="221" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">迁移成本</text>
<rect x="48" y="237" width="748" height="56" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<rect x="48" y="237" width="106" height="56" rx="0" fill="#eff5fb"/>
<rect x="48" y="237" width="3.2" height="56" rx="0" fill="#0070c0"/>
<text x="60" y="270" font-family="微软雅黑" font-size="14" font-weight="700" fill="#0070c0" text-anchor="start">02  复用</text>
<rect x="154" y="237" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="166" y="260" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">平台服务、共享模型</text>
<text x="166" y="277" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">组件、模板</text>
<rect x="420" y="237" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="432" y="270" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">减少重复建设</text>
<rect x="603" y="237" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="615" y="260" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">接入成本</text>
<text x="615" y="277" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">平台排队</text>
<rect x="48" y="293" width="748" height="56" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1"/>
<rect x="48" y="293" width="106" height="56" rx="0" fill="#f3f0fb"/>
<rect x="48" y="293" width="3.2" height="56" rx="0" fill="#6b5b95"/>
<text x="60" y="326" font-family="微软雅黑" font-size="14" font-weight="700" fill="#6b5b95" text-anchor="start">03  自动化</text>
<rect x="154" y="293" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="166" y="316" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">CI/CD、测试、发布</text>
<text x="166" y="333" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">CodeAgent、业务 Agent</text>
<rect x="420" y="293" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="432" y="326" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">减少机械劳动</text>
<rect x="603" y="293" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="615" y="316" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">审查负担</text>
<text x="615" y="333" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">质量风险</text>
<rect x="48" y="349" width="748" height="56" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<rect x="48" y="349" width="106" height="56" rx="0" fill="#eff7f3"/>
<rect x="48" y="349" width="3.2" height="56" rx="0" fill="#277e58"/>
<text x="60" y="382" font-family="微软雅黑" font-size="14" font-weight="700" fill="#277e58" text-anchor="start">04  优化</text>
<rect x="154" y="349" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="166" y="382" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">容量、许可、架构、性能</text>
<rect x="420" y="349" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="432" y="382" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">降低单位成本</text>
<rect x="603" y="349" width="1" height="56" rx="0" fill="#dde1e5"/>
<text x="615" y="382" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">优化空间有限</text>
<text x="48" y="423" font-family="微软雅黑" font-size="16" font-weight="700" fill="#24292f" text-anchor="start">组合收益：以全生命周期成本核算，而非简单相加</text>
<rect x="48" y="437" width="748" height="138" rx="8" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<text x="62" y="457" font-family="微软雅黑" font-size="12" font-weight="700" fill="#277e58" text-anchor="start">＋</text>
<text x="80" y="457" font-family="微软雅黑" font-size="12" font-weight="700" fill="#24292f" text-anchor="start">退役闲置资产</text>
<text x="194" y="457" font-family="微软雅黑" font-size="12" font-weight="400" fill="#60666d" text-anchor="start">现金节省</text>
<text x="62" y="479" font-family="微软雅黑" font-size="12" font-weight="700" fill="#277e58" text-anchor="start">＋</text>
<text x="80" y="479" font-family="微软雅黑" font-size="12" font-weight="700" fill="#24292f" text-anchor="start">平台复用</text>
<text x="194" y="479" font-family="微软雅黑" font-size="12" font-weight="400" fill="#60666d" text-anchor="start">减少重复开发工时</text>
<text x="62" y="501" font-family="微软雅黑" font-size="12" font-weight="700" fill="#277e58" text-anchor="start">＋</text>
<text x="80" y="501" font-family="微软雅黑" font-size="12" font-weight="700" fill="#24292f" text-anchor="start">自动化</text>
<text x="194" y="501" font-family="微软雅黑" font-size="12" font-weight="400" fill="#60666d" text-anchor="start">减少测试与发布工时</text>
<text x="405" y="457" font-family="微软雅黑" font-size="12" font-weight="700" fill="#277e58" text-anchor="start">＋</text>
<text x="423" y="457" font-family="微软雅黑" font-size="12" font-weight="700" fill="#24292f" text-anchor="start">元数据扩展</text>
<text x="535" y="457" font-family="微软雅黑" font-size="12" font-weight="400" fill="#60666d" text-anchor="start">减少分支与升级工时</text>
<text x="405" y="479" font-family="微软雅黑" font-size="12" font-weight="700" fill="#277e58" text-anchor="start">＋</text>
<text x="423" y="479" font-family="微软雅黑" font-size="12" font-weight="700" fill="#24292f" text-anchor="start">Agent 执行</text>
<text x="535" y="479" font-family="微软雅黑" font-size="12" font-weight="400" fill="#60666d" text-anchor="start">降低单位任务成本</text>
<rect x="62" y="512" width="720" height="1" rx="0" fill="#dde1e5"/>
<text x="62" y="532" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">−</text>
<text x="80" y="532" font-family="微软雅黑" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">平台建设、接入、迁移与治理成本</text>
<rect x="62" y="541" width="720" height="25" rx="4" fill="#fceff0"/>
<text x="422" y="559" font-family="微软雅黑" font-size="13" font-weight="700" fill="#c00000" text-anchor="middle">＝ 净收益（现金影响与容量释放分别核算）</text>
<rect x="820" y="151" width="412" height="214" rx="8" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<rect x="820" y="151" width="3.2" height="214" rx="0" fill="#c00000"/>
<text x="834" y="176" font-family="微软雅黑" font-size="14.67" font-weight="700" fill="#24292f" text-anchor="start">四项核算纪律</text>
<text x="834" y="198" font-family="微软雅黑" font-size="11" font-weight="700" fill="#0070c0" text-anchor="start">01</text>
<text x="860" y="198" font-family="微软雅黑" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">先建基线，再谈降本</text>
<text x="860" y="215" font-family="微软雅黑" font-size="11.5" font-weight="400" fill="#60666d" text-anchor="start">明确成本对象、统计口径与观察周期。</text>
<text x="834" y="241" font-family="微软雅黑" font-size="11" font-weight="700" fill="#0070c0" text-anchor="start">02</text>
<text x="860" y="241" font-family="微软雅黑" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">现金节省与容量释放分开</text>
<text x="860" y="258" font-family="微软雅黑" font-size="11.5" font-weight="400" fill="#60666d" text-anchor="start">工时节省不自动等于财务支出减少。</text>
<text x="834" y="284" font-family="微软雅黑" font-size="11" font-weight="700" fill="#0070c0" text-anchor="start">03</text>
<text x="860" y="284" font-family="微软雅黑" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">同一收益只计一次</text>
<text x="860" y="301" font-family="微软雅黑" font-size="11.5" font-weight="400" fill="#60666d" text-anchor="start">避免复用、自动化重复计算同一工时。</text>
<text x="834" y="327" font-family="微软雅黑" font-size="11" font-weight="700" fill="#0070c0" text-anchor="start">04</text>
<text x="860" y="327" font-family="微软雅黑" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">质量与风险同时验收</text>
<text x="860" y="344" font-family="微软雅黑" font-size="11.5" font-weight="400" fill="#60666d" text-anchor="start">降本不能以可靠性和业务连续性为代价。</text>
<rect x="820" y="379" width="412" height="196" rx="8" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1"/>
<rect x="820" y="379" width="3.2" height="196" rx="0" fill="#c00000"/>
<text x="834" y="404" font-family="微软雅黑" font-size="14.67" font-weight="700" fill="#24292f" text-anchor="start">三类反例：降本可能变成成本转移</text>
<text x="834" y="431" font-family="微软雅黑" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">过度压缩维护投入</text>
<text x="834" y="449" font-family="微软雅黑" font-size="12" font-weight="400" fill="#60666d" text-anchor="start">故障与事故成本上升，抵消预算节省。</text>
<text x="834" y="478" font-family="微软雅黑" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">过度自动化</text>
<text x="834" y="496" font-family="微软雅黑" font-size="12" font-weight="400" fill="#60666d" text-anchor="start">审查、维护和修复形成新的自动化债。</text>
<text x="834" y="525" font-family="微软雅黑" font-size="13" font-weight="700" fill="#24292f" text-anchor="start">平台整合不经济</text>
<text x="834" y="543" font-family="微软雅黑" font-size="12" font-weight="400" fill="#60666d" text-anchor="start">迁移成本可能超过未来三年累计节省。</text>
<rect x="48" y="589" width="1184" height="87" rx="4" fill="#fceff0"/>
<rect x="48" y="589" width="3.2" height="87" rx="0" fill="#c00000"/>
<text x="62" y="612" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">验证：</text>
<text x="116" y="612" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">选取闲置许可与重复测试两类成本，开展端到端对照验证。</text>
<rect x="116" y="624" width="154" height="25" rx="4" fill="#ffffff" stroke="#eebec2" stroke-width="1"/>
<text x="193" y="641" font-family="微软雅黑" font-size="12" font-weight="700" fill="#c00000" text-anchor="middle">成本基线</text>
<text x="283" y="641" font-family="微软雅黑" font-size="13" font-weight="700" fill="#c00000" text-anchor="middle">→</text>
<rect x="296" y="624" width="154" height="25" rx="4" fill="#ffffff" stroke="#eebec2" stroke-width="1"/>
<text x="373" y="641" font-family="微软雅黑" font-size="12" font-weight="700" fill="#c00000" text-anchor="middle">实施措施</text>
<text x="463" y="641" font-family="微软雅黑" font-size="13" font-weight="700" fill="#c00000" text-anchor="middle">→</text>
<rect x="476" y="624" width="154" height="25" rx="4" fill="#ffffff" stroke="#eebec2" stroke-width="1"/>
<text x="553" y="641" font-family="微软雅黑" font-size="12" font-weight="700" fill="#c00000" text-anchor="middle">实际结果</text>
<text x="643" y="641" font-family="微软雅黑" font-size="13" font-weight="700" fill="#c00000" text-anchor="middle">→</text>
<rect x="656" y="624" width="154" height="25" rx="4" fill="#ffffff" stroke="#eebec2" stroke-width="1"/>
<text x="733" y="641" font-family="微软雅黑" font-size="12" font-weight="700" fill="#c00000" text-anchor="middle">现金影响</text>
<text x="823" y="641" font-family="微软雅黑" font-size="13" font-weight="700" fill="#c00000" text-anchor="middle">→</text>
<rect x="836" y="624" width="154" height="25" rx="4" fill="#ffffff" stroke="#eebec2" stroke-width="1"/>
<text x="913" y="641" font-family="微软雅黑" font-size="12" font-weight="700" fill="#c00000" text-anchor="middle">质量影响</text>
<text x="1003" y="641" font-family="微软雅黑" font-size="13" font-weight="700" fill="#c00000" text-anchor="middle">→</text>
<rect x="1016" y="624" width="154" height="25" rx="4" fill="#ffffff" stroke="#eebec2" stroke-width="1"/>
<text x="1093" y="641" font-family="微软雅黑" font-size="12" font-weight="700" fill="#c00000" text-anchor="middle">持续时间</text>
<text x="116" y="665" font-family="微软雅黑" font-size="12" font-weight="700" fill="#c00000" text-anchor="start">启示：优先让成本真正退出，其次释放研发容量；不以工具上线、平台接入或生成代码量作为降本验收。</text>
<text x="48" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="start">56</text>
<text x="1232" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="end">Salesforce 技术洞察</text>
</svg>