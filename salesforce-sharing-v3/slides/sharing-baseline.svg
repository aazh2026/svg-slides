<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>OWD 决定起点，角色层级把已有访问向上继承</title>
  <rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" />
  <text x="48" y="64" font-family="微软雅黑" font-size="28" font-weight="700" fill="#c00000" text-anchor="start">OWD 决定起点，角色层级把已有访问向上继承</text>
  <text x="48" y="86" font-family="微软雅黑" font-size="13.33" font-weight="400" fill="#60666d" text-anchor="start">示例｜沿用小林的商机，对比组织默认值和继承设置  [E1] [E2]</text>
  <rect x="48" y="98" width="1184" height="4" rx="0" fill="#c00000" />
  <text x="48" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="start">2</text>
  <text x="1232" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="end">Salesforce 平台共享架构</text>
  <g id="main-visual">
    <text x="48" y="137" font-family="微软雅黑" font-size="14" font-weight="700" fill="#002060" text-anchor="start">角色继承树 · 箭头表示已有访问向上继承</text>
    <rect x="277" y="160" width="290" height="70" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="289" y="183" font-family="微软雅黑" font-size="14" font-weight="700" fill="#002060" text-anchor="start">销售总监</text>
    <text x="289" y="204" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">从下属角色继承相应访问</text>
    <rect x="76" y="291" width="284" height="72" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="88" y="314" font-family="微软雅黑" font-size="14" font-weight="700" fill="#002060" text-anchor="start">华东主管</text>
    <text x="88" y="335" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">继承小林拥有或已获共享的访问</text>
    <rect x="480" y="291" width="284" height="72" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="492" y="314" font-family="微软雅黑" font-size="14" font-weight="700" fill="#002060" text-anchor="start">华南主管</text>
    <text x="492" y="335" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">其他分支仍需独立授权</text>
    <line x1="218" y1="291" x2="218" y2="260" stroke="#0070c0" stroke-width="1.5" />
    <line x1="622" y1="291" x2="622" y2="260" stroke="#0070c0" stroke-width="1.5" />
    <line x1="218" y1="260" x2="622" y2="260" stroke="#0070c0" stroke-width="1.5" />
    <line x1="422" y1="260" x2="422" y2="237" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="422,230 418,237 426,237" fill="#0070c0" />
    <text x="440" y="248" font-family="微软雅黑" font-size="12" font-weight="400" fill="#60666d" text-anchor="start">管理继承</text>
    <rect x="48" y="435" width="223" height="72" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="458" font-family="微软雅黑" font-size="14" font-weight="700" fill="#002060" text-anchor="start">销售小林</text>
    <text x="60" y="479" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">拥有华东商机 A</text>
    <rect x="292" y="435" width="223" height="72" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="304" y="458" font-family="微软雅黑" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">同角色同事</text>
    <text x="304" y="479" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">同级无自动授权</text>
    <rect x="541" y="435" width="223" height="72" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="553" y="458" font-family="微软雅黑" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">华南销售</text>
    <text x="553" y="479" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">独立角色分支</text>
    <line x1="159" y1="435" x2="159" y2="402" stroke="#0070c0" stroke-width="1.5" />
    <line x1="403" y1="435" x2="403" y2="402" stroke="#0070c0" stroke-width="1.5" />
    <line x1="159" y1="402" x2="403" y2="402" stroke="#0070c0" stroke-width="1.5" />
    <line x1="218" y1="402" x2="218" y2="370" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="218,363 214,370 222,370" fill="#0070c0" />
    <line x1="652" y1="435" x2="652" y2="402" stroke="#0070c0" stroke-width="1.5" />
    <line x1="622" y1="402" x2="652" y2="402" stroke="#0070c0" stroke-width="1.5" />
    <line x1="622" y1="402" x2="622" y2="370" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="622,363 618,370 626,370" fill="#0070c0" />
    <rect x="48" y="550" width="223" height="57" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="573" font-family="微软雅黑" font-size="14" font-weight="700" fill="#002060" text-anchor="start">商机 A</text>
    <text x="60" y="594" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">所有权</text>
    <rect x="292" y="550" width="223" height="57" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="304" y="573" font-family="微软雅黑" font-size="14" font-weight="700" fill="#002060" text-anchor="start">另一条商机 B</text>
    <text x="304" y="594" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">共享给小林 · 只读</text>
    <line x1="159" y1="550" x2="159" y2="514" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="159,507 155,514 163,514" fill="#0070c0" />
    <line x1="403" y1="550" x2="403" y2="529" stroke="#0070c0" stroke-width="1.5" />
    <line x1="403" y1="529" x2="240" y2="529" stroke="#0070c0" stroke-width="1.5" />
    <line x1="240" y1="529" x2="240" y2="514" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="240,507 236,514 244,514" fill="#0070c0" />
    <text x="810" y="137" font-family="微软雅黑" font-size="14" font-weight="700" fill="#002060" text-anchor="start">组织范围默认值 OWD</text>
    <rect x="810" y="160" width="422" height="96" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="822" y="183" font-family="微软雅黑" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">Private</text>
    <text x="822" y="204" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">跨所有者访问需要单独依据。</text>
    <rect x="810" y="271" width="422" height="96" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="822" y="294" font-family="微软雅黑" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">Public Read Only</text>
    <text x="822" y="315" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">默认读他人商机。编辑还需记录级写入授权。</text>
    <rect x="810" y="382" width="422" height="96" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="822" y="405" font-family="微软雅黑" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">Controlled by Parent</text>
    <text x="822" y="426" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">支持的对象根据关联父记录确定访问。</text>
    <rect x="810" y="493" width="422" height="96" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="822" y="516" font-family="微软雅黑" font-size="14" font-weight="700" fill="#24292f" text-anchor="start">自定义对象的继承开关</text>
    <text x="822" y="537" font-family="微软雅黑" font-size="13" font-weight="400" fill="#24292f" text-anchor="start">可关闭通过角色层级授权。OWD 变更会触发重算。</text>
  </g>
  <rect x="48" y="628" width="1184" height="48" rx="4" fill="#fceff0" />
  <text x="62" y="656.2" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">设计建议｜用同级、上级和跨分支三类用户验证 OWD，再评估更改基线的重算窗口。</text>
</svg>