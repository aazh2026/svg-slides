<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>从对象权限出发，沿预期授权路径定位记录不可见</title>
  <rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" />
  <text x="48" y="64" font-family="微软雅黑" font-size="28" font-weight="700" fill="#c00000" text-anchor="start">从对象权限出发，沿预期授权路径定位记录不可见</text>
  <text x="48" y="86" font-family="微软雅黑" font-size="13.33" font-weight="400" fill="#60666d" text-anchor="start">贯穿示例｜售前原应能看华东商机，转交后反馈无法访问  [E1] [E2] [E3] [E5] [E7]</text>
  <rect x="48" y="98" width="1184" height="4" rx="0" fill="#c00000" />
  <text x="48" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="start">8</text>
  <text x="1232" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="end">Salesforce 平台共享架构</text>
  <g id="main-visual">
    <text x="48" y="132.668" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">排障决策树 · 一名用户、一条记录、一个预期操作</text>
    <rect x="362" y="143.476" width="392" height="48.636" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="374" y="161.232" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">售前反馈华东商机不可见</text>
    <text x="374" y="177.444" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">验证用户身份、预期操作与当前所有者</text>
    <line x1="558" y1="192.112" x2="558" y2="206.780" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="558,212.184 562,206.780 554,206.780" fill="#0070c0" />
    <rect x="362" y="212.184" width="392" height="50.180" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="374" y="229.940" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">有商机读取权限吗？</text>
    <text x="374" y="246.152" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">仅个别字段异常时核对字段级安全</text>
    <line x1="362" y1="237.660" x2="330" y2="237.660" stroke="#c00000" stroke-width="1.5" />
    <polygon points="323,237.660 330,240.748 330,234.572" fill="#c00000" />
    <text x="332" y="228.396" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#c00000" text-anchor="start">否</text>
    <rect x="48" y="212.184" width="275" height="50.180" rx="7" fill="#fff1f2" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="229.940" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#a50009" text-anchor="start">修正对象授权</text>
    <text x="60" y="246.152" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">核对许可证和对象权限</text>
    <line x1="558" y1="262.364" x2="558" y2="278.576" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="558,283.980 562,278.576 554,278.576" fill="#0070c0" />
    <text x="572" y="277.032" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#60666d" text-anchor="start">是</text>
    <rect x="362" y="283.980" width="392" height="50.180" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="374" y="301.736" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">基线或角色继承覆盖这名用户吗？</text>
    <text x="374" y="317.948" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">核对 OWD 与双方角色分支</text>
    <line x1="754" y1="308.684" x2="799" y2="308.684" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="806,308.684 799,305.596 799,311.772" fill="#0070c0" />
    <text x="772" y="299.420" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#60666d" text-anchor="start">是</text>
    <rect x="806" y="283.980" width="426" height="50.180" rx="7" fill="#f3f0fb" stroke="#dde1e5" stroke-width="1" />
    <text x="818" y="301.736" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#2d1b4e" text-anchor="start">核对额外限制</text>
    <text x="818" y="317.948" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">适用时查限制规则和记录匹配条件</text>
    <line x1="558" y1="334.160" x2="558" y2="359.636" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="558,365.040 562,359.636 554,359.636" fill="#0070c0" />
    <text x="572" y="354.232" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#60666d" text-anchor="start">否 → 查预期的横向授权</text>
    <line x1="183" y1="365.040" x2="1074" y2="365.040" stroke="#0070c0" stroke-width="1.5" />
    <line x1="183" y1="365.040" x2="183" y2="380.480" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="183,385.884 187,380.480 179,380.480" fill="#0070c0" />
    <rect x="48" y="385.884" width="273" height="53.268" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="403.640" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">规则或公共组</text>
    <text x="60" y="419.852" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">核对条件、源记录和接收方</text>
    <line x1="480" y1="365.040" x2="480" y2="380.480" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="480,385.884 484,380.480 476,380.480" fill="#0070c0" />
    <rect x="345" y="385.884" width="273" height="53.268" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="357" y="403.640" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">团队或区域</text>
    <text x="357" y="419.852" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">核对成员资格、记录归属</text>
    <line x1="777" y1="365.040" x2="777" y2="380.480" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="777,385.884 781,380.480 773,380.480" fill="#0070c0" />
    <rect x="642" y="385.884" width="273" height="53.268" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="654" y="403.640" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">手工共享</text>
    <text x="654" y="419.852" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">检查是否因转移所有权清除</text>
    <line x1="1074" y1="365.040" x2="1074" y2="380.480" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="1074,385.884 1078,380.480 1070,380.480" fill="#0070c0" />
    <rect x="939" y="385.884" width="273" height="53.268" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="951" y="403.640" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">程序共享</text>
    <text x="951" y="419.852" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">核对触发条件与实际共享记录</text>
    <line x1="183" y1="439.152" x2="183" y2="455.364" stroke="#0070c0" stroke-width="1.5" />
    <line x1="480" y1="439.152" x2="480" y2="455.364" stroke="#0070c0" stroke-width="1.5" />
    <line x1="777" y1="439.152" x2="777" y2="455.364" stroke="#0070c0" stroke-width="1.5" />
    <line x1="1074" y1="439.152" x2="1074" y2="455.364" stroke="#0070c0" stroke-width="1.5" />
    <line x1="183" y1="455.364" x2="1074" y2="455.364" stroke="#0070c0" stroke-width="1.5" />
    <line x1="558" y1="455.364" x2="558" y2="459.996" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="558,465.400 562,459.996 554,459.996" fill="#0070c0" />
    <rect x="362" y="465.400" width="392" height="36.284" rx="7" fill="#eff7f3" stroke="#dde1e5" stroke-width="1" />
    <text x="374" y="483.156" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#277e58" text-anchor="start">按同一用户复测并记录命中路径</text>
  </g>
  <rect x="48" y="512" width="1184" height="106" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="62" y="530" font-family="微软雅黑" font-size="13" font-weight="700" fill="#002060" text-anchor="start">机制说明与验证要点</text>
  <text x="62" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">对象入口  [E1]</text>
  <text x="62" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">先核对许可证、商机读取权和实际用户身份。</text>
  <text x="351" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">字段分流  [E1]</text>
  <text x="351" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">只有金额不可见时优先检查字段级安全。</text>
  <text x="640" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">层级证据  [E7]</text>
  <text x="640" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">对照请求者和当前所有者所在的角色分支。</text>
  <text x="929" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">规则证据  [E7]</text>
  <text x="929" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">核对记录是否命中规则、用户是否属于接收组。</text>
  <text x="62" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">团队与区域  [E7]</text>
  <text x="62" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">同时核对成员身份和记录关联范围。</text>
  <text x="351" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">交接例外  [E3]</text>
  <text x="351" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">所有者刚变更时检查是否清理了 Manual。</text>
  <text x="640" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">额外过滤  [E5]</text>
  <text x="640" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">已获得访问仍不可见时检查适用的限制规则。</text>
  <text x="929" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">复测建议  [E7]</text>
  <text x="929" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">对照应可见与应隔离的用户，查找过度授权。</text>
  <rect x="48" y="628" width="1184" height="48" rx="4" fill="#fceff0" />
  <text x="62" y="656.2" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">设计建议｜每次用一名用户、一条记录和一个预期操作复现，记录最终命中的授权依据。</text>
</svg>