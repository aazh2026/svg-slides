<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>OWD 决定起点，角色层级把已有访问向上继承</title>
  <rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" />
  <text x="48" y="64" font-family="微软雅黑" font-size="28" font-weight="700" fill="#c00000" text-anchor="start">OWD 决定起点，角色层级把已有访问向上继承</text>
  <text x="48" y="86" font-family="微软雅黑" font-size="13.33" font-weight="400" fill="#60666d" text-anchor="start">示例｜沿用小林的商机，对比组织默认值和继承设置  [E1] [E2]</text>
  <rect x="48" y="98" width="1184" height="4" rx="0" fill="#c00000" />
  <text x="48" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="start">2</text>
  <text x="1232" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="end">Salesforce 平台共享架构</text>
  <g id="main-visual">
    <text x="48" y="132.668" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">角色继承树 · 箭头表示已有访问向上继承</text>
    <rect x="277" y="150.424" width="290" height="54.040" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="289" y="168.180" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">销售总监</text>
    <text x="289" y="184.392" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">从下属角色继承相应访问</text>
    <rect x="76" y="251.556" width="284" height="55.584" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="88" y="269.312" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">华东主管</text>
    <text x="88" y="285.524" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">继承小林拥有或已获共享的访问</text>
    <rect x="480" y="251.556" width="284" height="55.584" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="492" y="269.312" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">华南主管</text>
    <text x="492" y="285.524" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">其他分支仍需独立授权</text>
    <line x1="218" y1="251.556" x2="218" y2="227.624" stroke="#0070c0" stroke-width="1.5" />
    <line x1="622" y1="251.556" x2="622" y2="227.624" stroke="#0070c0" stroke-width="1.5" />
    <line x1="218" y1="227.624" x2="622" y2="227.624" stroke="#0070c0" stroke-width="1.5" />
    <line x1="422" y1="227.624" x2="422" y2="209.868" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="422,204.464 418,209.868 426,209.868" fill="#0070c0" />
    <text x="440" y="218.360" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#60666d" text-anchor="start">管理继承</text>
    <rect x="48" y="362.724" width="223" height="55.584" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="380.480" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">销售小林</text>
    <text x="60" y="396.692" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">拥有华东商机 A</text>
    <rect x="292" y="362.724" width="223" height="55.584" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="304" y="380.480" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">同角色同事</text>
    <text x="304" y="396.692" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">同级无自动授权</text>
    <rect x="541" y="362.724" width="223" height="55.584" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="553" y="380.480" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">华南销售</text>
    <text x="553" y="396.692" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">独立角色分支</text>
    <line x1="159" y1="362.724" x2="159" y2="337.248" stroke="#0070c0" stroke-width="1.5" />
    <line x1="403" y1="362.724" x2="403" y2="337.248" stroke="#0070c0" stroke-width="1.5" />
    <line x1="159" y1="337.248" x2="403" y2="337.248" stroke="#0070c0" stroke-width="1.5" />
    <line x1="218" y1="337.248" x2="218" y2="312.544" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="218,307.140 214,312.544 222,312.544" fill="#0070c0" />
    <line x1="652" y1="362.724" x2="652" y2="337.248" stroke="#0070c0" stroke-width="1.5" />
    <line x1="622" y1="337.248" x2="652" y2="337.248" stroke="#0070c0" stroke-width="1.5" />
    <line x1="622" y1="337.248" x2="622" y2="312.544" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="622,307.140 618,312.544 626,312.544" fill="#0070c0" />
    <rect x="48" y="451.504" width="223" height="44.004" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="469.260" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">商机 A</text>
    <text x="60" y="485.472" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">所有权</text>
    <rect x="292" y="451.504" width="223" height="44.004" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="304" y="469.260" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">另一条商机 B</text>
    <text x="304" y="485.472" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">共享给小林 · 只读</text>
    <line x1="159" y1="451.504" x2="159" y2="423.712" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="159,418.308 155,423.712 163,423.712" fill="#0070c0" />
    <line x1="403" y1="451.504" x2="403" y2="435.292" stroke="#0070c0" stroke-width="1.5" />
    <line x1="403" y1="435.292" x2="240" y2="435.292" stroke="#0070c0" stroke-width="1.5" />
    <line x1="240" y1="435.292" x2="240" y2="423.712" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="240,418.308 236,423.712 244,423.712" fill="#0070c0" />
    <text x="810" y="132.668" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">组织范围默认值 OWD</text>
    <rect x="810" y="150.424" width="422" height="74.112" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="822" y="168.180" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">Private</text>
    <text x="822" y="184.392" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">跨所有者访问需要单独依据。</text>
    <rect x="810" y="236.116" width="422" height="74.112" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="822" y="253.872" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">Public Read Only</text>
    <text x="822" y="270.084" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">默认读他人商机。编辑还需记录级写入授权。</text>
    <rect x="810" y="321.808" width="422" height="74.112" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="822" y="339.564" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">Controlled by Parent</text>
    <text x="822" y="355.776" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">支持的对象根据关联父记录确定访问。</text>
    <rect x="810" y="407.500" width="422" height="74.112" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="822" y="425.256" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">自定义对象的继承开关</text>
    <text x="822" y="441.468" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">可关闭通过角色层级授权。OWD 变更会触发重算。</text>
  </g>
  <rect x="48" y="512" width="1184" height="106" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="62" y="530" font-family="微软雅黑" font-size="13" font-weight="700" fill="#002060" text-anchor="start">机制说明与验证要点</text>
  <text x="62" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">私有基线  [E2]</text>
  <text x="62" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">同级用户可通过共享规则等获得例外访问。</text>
  <text x="351" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">公开只读  [E2]</text>
  <text x="351" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">拥有对象编辑权的同事也只获得记录读取权。</text>
  <text x="640" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">访问级别  [E2]</text>
  <text x="640" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">下属只有只读的记录，主管继承后仍为只读。</text>
  <text x="929" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">继承来源  [E2]</text>
  <text x="929" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">角色向上继承覆盖所有权及下属获共享的记录。</text>
  <text x="62" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">角色建模  [E2]</text>
  <text x="62" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">按经理需要查看的数据范围划分角色分支。</text>
  <text x="351" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">队列持有  [E2]</text>
  <text x="351" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">受支持对象的记录可由适格成员领取处理。</text>
  <text x="640" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">自定义对象  [E2]</text>
  <text x="640" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">关闭层级授权会切断此对象的角色继承。</text>
  <text x="929" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">变更验证  [E2]</text>
  <text x="929" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">OWD 改动后以代表用户复测并记录重算耗时。</text>
  <rect x="48" y="628" width="1184" height="48" rx="4" fill="#fceff0" />
  <text x="62" y="656.2" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">设计建议｜用同级、上级和跨分支三类用户验证 OWD，再评估更改基线的重算窗口。</text>
</svg>