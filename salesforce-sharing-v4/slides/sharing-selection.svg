<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>同一条商机可按记录集合、协作成员或业务事件授权</title>
  <rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" />
  <text x="48" y="64" font-family="微软雅黑" font-size="28" font-weight="700" fill="#c00000" text-anchor="start">同一条商机可按记录集合、协作成员或业务事件授权</text>
  <text x="48" y="86" font-family="微软雅黑" font-size="13.33" font-weight="400" fill="#60666d" text-anchor="start">机制选型｜从谁需要访问、需要多少条记录以及授权何时变更出发  [E3] [E4]</text>
  <rect x="48" y="98" width="1184" height="4" rx="0" fill="#c00000" />
  <text x="48" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="start">3</text>
  <text x="1232" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="end">Salesforce 平台共享架构</text>
  <g id="main-visual">
    <text x="48" y="132.668" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">按记录选择方式对照授权机制</text>
    <rect x="48" y="145.020" width="226" height="31.652" rx="0" fill="#303338" />
    <text x="60" y="165.092" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#ffffff" text-anchor="start">业务需求</text>
    <rect x="274" y="145.020" width="216" height="31.652" rx="0" fill="#303338" />
    <text x="286" y="165.092" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#ffffff" text-anchor="start">记录选择条件</text>
    <rect x="490" y="145.020" width="226" height="31.652" rx="0" fill="#303338" />
    <text x="502" y="165.092" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#ffffff" text-anchor="start">机制</text>
    <rect x="716" y="145.020" width="240" height="31.652" rx="0" fill="#303338" />
    <text x="728" y="165.092" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#ffffff" text-anchor="start">接收方</text>
    <rect x="956" y="145.020" width="276" height="31.652" rx="0" fill="#303338" />
    <text x="968" y="165.092" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#ffffff" text-anchor="start">维护要点</text>
    <rect x="48" y="176.672" width="226" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="203.615" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">运营看华东商机</text>
    <rect x="274" y="176.672" width="216" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="286" y="203.615" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">所有者属于华东角色分支</text>
    <rect x="490" y="176.672" width="226" height="47.864" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="502" y="203.615" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">基于所有者的规则</text>
    <rect x="716" y="176.672" width="240" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="728" y="203.615" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">运营公共组</text>
    <rect x="956" y="176.672" width="276" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="968" y="203.615" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">成员变化由公共组管理</text>
    <rect x="48" y="224.536" width="226" height="47.864" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="251.479" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">合规查看指定阶段</text>
    <rect x="274" y="224.536" width="216" height="47.864" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
    <text x="286" y="251.479" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">商机阶段命中配置条件</text>
    <rect x="490" y="224.536" width="226" height="47.864" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="502" y="251.479" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">基于条件的规则</text>
    <rect x="716" y="224.536" width="240" height="47.864" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
    <text x="728" y="251.479" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">合规公共组</text>
    <rect x="956" y="224.536" width="276" height="47.864" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
    <text x="968" y="251.479" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">覆盖满足条件的记录集合</text>
    <rect x="48" y="272.400" width="226" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="299.343" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">售前介入一笔商机</text>
    <rect x="274" y="272.400" width="216" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="286" y="299.343" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">当前商机</text>
    <rect x="490" y="272.400" width="226" height="47.864" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="502" y="299.343" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">商机团队</text>
    <rect x="716" y="272.400" width="240" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="728" y="299.343" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">指定售前成员</text>
    <rect x="956" y="272.400" width="276" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="968" y="299.343" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">为团队成员设只读或读写</text>
    <rect x="48" y="320.264" width="226" height="47.864" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="347.207" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">代班临时访问</text>
    <rect x="274" y="320.264" width="216" height="47.864" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
    <text x="286" y="347.207" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">当前记录</text>
    <rect x="490" y="320.264" width="226" height="47.864" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="502" y="347.207" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">手工共享</text>
    <rect x="716" y="320.264" width="240" height="47.864" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
    <text x="728" y="347.207" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">指定用户、角色或组</text>
    <rect x="956" y="320.264" width="276" height="47.864" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
    <text x="968" y="347.207" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">所有者转移后重新核对</text>
    <rect x="48" y="368.128" width="226" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="395.071" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">外部系统分配访问</text>
    <rect x="274" y="368.128" width="216" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="286" y="395.071" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">由业务逻辑或外部系统决定</text>
    <rect x="490" y="368.128" width="226" height="47.864" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="502" y="395.071" font-family="微软雅黑" font-size="11.70" font-weight="700" fill="#002060" text-anchor="start">Apex 程序化共享</text>
    <rect x="716" y="368.128" width="240" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="728" y="395.071" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">外部名单中的用户或组</text>
    <rect x="956" y="368.128" width="276" height="47.864" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="968" y="395.071" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">维护共享原因、同步和撤销</text>
    <rect x="48" y="430.660" width="564" height="61.760" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="448.416" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">公共组负责组织接收方</text>
    <text x="60" y="464.628" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">可包含用户、角色、区域和其他组；原文建议嵌套不超过五层。</text>
    <rect x="636" y="430.660" width="596" height="61.760" rx="7" fill="#f3f0fb" stroke="#dde1e5" stroke-width="1" />
    <text x="648" y="448.416" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#2d1b4e" text-anchor="start">Apex 用于声明式覆盖不到的授权</text>
    <text x="648" y="464.628" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">适用于复杂动态分配或持续沿用外部授权来源。</text>
  </g>
  <rect x="48" y="512" width="1184" height="106" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="62" y="530" font-family="微软雅黑" font-size="13" font-weight="700" fill="#002060" text-anchor="start">机制说明与验证要点</text>
  <text x="62" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">所有者规则  [E3]</text>
  <text x="62" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">改变记录所有者可能改变规则的命中范围。</text>
  <text x="447.333" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">条件规则  [E3]</text>
  <text x="447.333" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">用业务字段定义共享范围，接收方单独配置。</text>
  <text x="832.667" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">公共组  [E3]</text>
  <text x="832.667" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">多层嵌套会增加成员计算的维护成本。</text>
  <text x="62" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">团队级别  [E3]</text>
  <text x="62" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">同一商机不同成员可获得不同的访问级别。</text>
  <text x="447.333" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">手工授权  [E3]</text>
  <text x="447.333" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">可按记录授予指定主体只读或读写访问。</text>
  <text x="832.667" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">代码边界  [E3]</text>
  <text x="832.667" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">以外部系统作权威来源时需同步添加与撤销。</text>
  <rect x="48" y="628" width="1184" height="48" rx="4" fill="#fceff0" />
  <text x="62" y="656.2" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">设计建议｜先按业务范围匹配声明式机制，再判断其余动态授权是否需要 Apex。</text>
</svg>