<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>角色层级与销售区域分别承载管理访问和矩阵覆盖</title>
  <rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" />
  <text x="48" y="64" font-family="微软雅黑" font-size="28" font-weight="700" fill="#c00000" text-anchor="start">角色层级与销售区域分别承载管理访问和矩阵覆盖</text>
  <text x="48" y="86" font-family="微软雅黑" font-size="13.33" font-weight="400" fill="#60666d" text-anchor="start">原文案例改绘｜零售与再营销各自汇总业绩，同时参与同一客户  [E2] [E4]</text>
  <rect x="48" y="98" width="1184" height="4" rx="0" fill="#c00000" />
  <text x="48" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="start">4</text>
  <text x="1232" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="end">Salesforce 平台共享架构</text>
  <g id="main-visual">
    <text x="48" y="132.668" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">企业销售区域管理 · 两条业务线汇聚到同一账户</text>
    <text x="972" y="132.668" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">管理继承与临时协作</text>
    <rect x="48" y="160.460" width="266" height="65.620" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="178.216" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">零售团队</text>
    <text x="60" y="194.428" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">零售经理与销售代表</text>
    <rect x="48" y="305.596" width="266" height="65.620" rx="7" fill="#f3f0fb" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="323.352" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#2d1b4e" text-anchor="start">再营销团队</text>
    <text x="60" y="339.564" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">再营销经理与销售代表</text>
    <rect x="362" y="160.460" width="254" height="65.620" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="374" y="178.216" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">零售区域分支</text>
    <text x="374" y="194.428" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">汇总本业务线的销售业绩</text>
    <rect x="362" y="305.596" width="254" height="65.620" rx="7" fill="#f3f0fb" stroke="#dde1e5" stroke-width="1" />
    <text x="374" y="323.352" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#2d1b4e" text-anchor="start">再营销区域分支</text>
    <text x="374" y="339.564" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">保留独立的区域结构</text>
    <line x1="314" y1="193.656" x2="355" y2="193.656" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="362,193.656 355,190.568 355,196.744" fill="#0070c0" />
    <line x1="314" y1="338.792" x2="355" y2="338.792" stroke="#6b5b95" stroke-width="1.5" />
    <polygon points="362,338.792 355,335.704 355,341.880" fill="#6b5b95" />
    <text x="319" y="182.076" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#60666d" text-anchor="start">成员</text>
    <text x="319" y="326.440" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#6b5b95" text-anchor="start">成员</text>
    <rect x="713" y="217.588" width="220" height="102.676" rx="7" fill="#eff7f3" stroke="#dde1e5" stroke-width="1" />
    <text x="725" y="235.344" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#277e58" text-anchor="start">共用账户 A</text>
    <text x="725" y="251.556" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">两条业务线按各自区域配置获得</text>
    <text x="725" y="265.606" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">访问</text>
    <line x1="616" y1="193.656" x2="659" y2="193.656" stroke="#0070c0" stroke-width="1.5" />
    <line x1="659" y1="193.656" x2="659" y2="245.380" stroke="#0070c0" stroke-width="1.5" />
    <line x1="659" y1="245.380" x2="706" y2="245.380" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="713,245.380 706,242.292 706,248.468" fill="#0070c0" />
    <line x1="616" y1="338.792" x2="659" y2="338.792" stroke="#6b5b95" stroke-width="1.5" />
    <line x1="659" y1="338.792" x2="659" y2="291.700" stroke="#6b5b95" stroke-width="1.5" />
    <line x1="659" y1="291.700" x2="706" y2="291.700" stroke="#6b5b95" stroke-width="1.5" />
    <polygon points="713,291.700 706,288.612 706,294.788" fill="#6b5b95" />
    <text x="666" y="236.116" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#60666d" text-anchor="start">区域关联</text>
    <text x="666" y="283.208" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#6b5b95" text-anchor="start">区域关联</text>
    <rect x="48" y="419.852" width="568" height="70.252" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="60" y="437.608" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">为什么选择区域层级</text>
    <text x="60" y="453.820" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">共享覆盖由两条销售分支决定，案例要求各自维护管理与汇总结构。</text>
    <line x1="823" y1="320.264" x2="823" y2="388.972" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="823,394.376 827,388.972 819,388.972" fill="#0070c0" />
    <text x="833" y="365.040" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#60666d" text-anchor="start">关联商机</text>
    <rect x="713" y="394.376" width="220" height="64.076" rx="7" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
    <text x="725" y="412.132" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#002060" text-anchor="start">账户 A 下的商机</text>
    <text x="725" y="428.344" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">逐笔协作仍可用商机团队</text>
    <rect x="972" y="155.056" width="260" height="57.900" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="984" y="172.812" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">销售主管</text>
    <text x="984" y="189.024" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">沿角色层级继承访问</text>
    <rect x="972" y="250.784" width="260" height="57.900" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="984" y="268.540" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">销售小林</text>
    <text x="984" y="284.752" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">所有或获共享的记录</text>
    <line x1="1102" y1="250.784" x2="1102" y2="218.360" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="1102,212.956 1098,218.360 1106,218.360" fill="#0070c0" />
    <text x="1114" y="234.572" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#60666d" text-anchor="start">向上继承</text>
    <rect x="972" y="394.376" width="260" height="64.076" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
    <text x="984" y="412.132" font-family="微软雅黑" font-size="12.60" font-weight="700" fill="#24292f" text-anchor="start">临时售前顾问</text>
    <text x="984" y="428.344" font-family="微软雅黑" font-size="11.70" font-weight="400" fill="#24292f" text-anchor="start">按商机团队成员权限协作</text>
    <line x1="972" y1="427.572" x2="940" y2="427.572" stroke="#0070c0" stroke-width="1.5" />
    <polygon points="933,427.572 940,430.660 940,424.484" fill="#0070c0" />
    <text x="951" y="475.436" font-family="微软雅黑" font-size="11.00" font-weight="400" fill="#60666d" text-anchor="start">单笔协作独立配置</text>
  </g>
  <rect x="48" y="512" width="1184" height="106" rx="7" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="62" y="530" font-family="微软雅黑" font-size="13" font-weight="700" fill="#002060" text-anchor="start">机制说明与验证要点</text>
  <text x="62" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">管理维度  [E2]</text>
  <text x="62" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">角色结构按管理访问需求分支。</text>
  <text x="447.333" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">销售维度  [E4]</text>
  <text x="447.333" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">区域层级适合矩阵式覆盖和独立汇总。</text>
  <text x="832.667" y="548" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">独立维护  [E4]</text>
  <text x="832.667" y="561.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">启用区域管理后仍需维护角色层级。</text>
  <text x="62" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">区域成员  [E4]</text>
  <text x="62" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">跨业务线支援可按区域子分支建模。</text>
  <text x="447.333" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">逐笔授权  [E4]</text>
  <text x="447.333" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">临时售前加入商机团队即可获得该笔访问。</text>
  <text x="832.667" y="585" font-family="微软雅黑" font-size="11" font-weight="700" fill="#002060" text-anchor="start">设计建议  [E4]</text>
  <text x="832.667" y="598.2" font-family="微软雅黑" font-size="11.2" font-weight="400" fill="#24292f" text-anchor="start">复用区域覆盖前先确认它已满足协作范围。</text>
  <rect x="48" y="628" width="1184" height="48" rx="4" fill="#fceff0" />
  <text x="62" y="656.2" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">设计建议｜两套层级分别对齐管理和销售访问需求，避免因结构重复增加共享计算。</text>
</svg>