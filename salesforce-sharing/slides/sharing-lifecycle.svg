<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>共享记录的生命周期取决于授权原因和记录变更</title>
  <rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" />
  <text x="48" y="64" font-family="微软雅黑" font-size="28" font-weight="700" fill="#c00000" text-anchor="start">共享记录的生命周期取决于授权原因和记录变更</text>
  <text x="48" y="86" font-family="微软雅黑" font-size="13.33" font-weight="400" fill="#60666d" text-anchor="start">实现约束｜区分团队成员记录、共享记录及共享原因（RowCause）  [E3]</text>
  <rect x="48" y="98" width="1184" height="4" rx="0" fill="#c00000" />
  <text x="48" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="start">5</text>
  <text x="1232" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="end">Salesforce 平台共享架构</text>
  <rect x="48" y="628" width="1184" height="48" rx="4" fill="#fceff0" />
  <text x="62" y="656.2" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">设计建议｜在测试中覆盖团队成员移除、所有者转移以及外部授权同步。</text>
  <rect x="48" y="120" width="1184" height="34" rx="0" fill="#303338" />
  <text x="57" y="140.6" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">授权方式</text>
  <text x="353" y="140.6" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">关联数据</text>
  <text x="705.381" y="140.6" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">关键行为</text>
  <rect x="48" y="154" width="296" height="153.333" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
  <text x="57" y="234.267" font-family="微软雅黑" font-size="12" font-weight="700" fill="#0070c0" text-anchor="start">标准记录团队</text>
  <rect x="344" y="154" width="352.381" height="153.333" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="353" y="234.267" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">团队成员记录 + 关联共享记录</text>
  <rect x="696.381" y="154" width="535.619" height="153.333" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="705.381" y="234.267" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">界面添加成员时生成两条记录，按原文做法，程序化实现需管理两者</text>
  <rect x="48" y="307.333" width="296" height="153.333" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
  <text x="57" y="387.6" font-family="微软雅黑" font-size="12" font-weight="700" fill="#0070c0" text-anchor="start">手工共享</text>
  <rect x="344" y="307.333" width="352.381" height="153.333" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
  <text x="353" y="387.6" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">RowCause = Manual</text>
  <rect x="696.381" y="307.333" width="535.619" height="153.333" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
  <text x="705.381" y="387.6" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">所有者转移时清除。通过代码创建的 Manual 共享也受此约束</text>
  <rect x="48" y="460.667" width="296" height="153.333" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
  <text x="57" y="540.933" font-family="微软雅黑" font-size="12" font-weight="700" fill="#0070c0" text-anchor="start">自定义对象 Apex 共享</text>
  <rect x="344" y="460.667" width="352.381" height="153.333" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="353" y="540.933" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">自定义 Apex Sharing Reason</text>
  <rect x="696.381" y="460.667" width="535.619" height="153.333" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="705.381" y="540.933" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">按业务原因标识共享，便于独立维护和删除</text>
</svg>