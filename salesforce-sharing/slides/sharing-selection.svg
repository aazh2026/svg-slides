<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>按授权粒度选择共享规则、团队或 Apex</title>
  <rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" />
  <text x="48" y="64" font-family="微软雅黑" font-size="28" font-weight="700" fill="#c00000" text-anchor="start">按授权粒度选择共享规则、团队或 Apex</text>
  <text x="48" y="86" font-family="微软雅黑" font-size="13.33" font-weight="400" fill="#60666d" text-anchor="start">选型矩阵｜先确认共享范围、接收方与变更触发条件  [E3] [E4]</text>
  <rect x="48" y="98" width="1184" height="4" rx="0" fill="#c00000" />
  <text x="48" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="start">3</text>
  <text x="1232" y="700" font-family="微软雅黑" font-size="9.33" font-weight="400" fill="#8c8c8c" text-anchor="end">Salesforce 平台共享架构</text>
  <rect x="48" y="628" width="1184" height="48" rx="4" fill="#fceff0" />
  <text x="62" y="656.2" font-family="微软雅黑" font-size="14" font-weight="700" fill="#c00000" text-anchor="start">设计建议｜优先用声明式机制表达稳定需求，将代码用于声明式能力无法覆盖的场景。</text>
  <rect x="48" y="120" width="1184" height="34" rx="0" fill="#303338" />
  <text x="57" y="140.6" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">业务需求</text>
  <text x="387.419" y="140.6" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">共享机制</text>
  <text x="717.837" y="140.6" font-family="微软雅黑" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">适用方式</text>
  <rect x="48" y="154" width="330.419" height="76.667" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
  <text x="57" y="195.933" font-family="微软雅黑" font-size="12" font-weight="700" fill="#0070c0" text-anchor="start">按所属团队批量开放</text>
  <rect x="378.419" y="154" width="330.419" height="76.667" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="387.419" y="195.933" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">基于所有者的共享规则</text>
  <rect x="708.837" y="154" width="523.163" height="76.667" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="717.837" y="195.933" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">例如将某业务分支持有的记录共享给运营组</text>
  <rect x="48" y="230.667" width="330.419" height="76.667" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
  <text x="57" y="272.6" font-family="微软雅黑" font-size="12" font-weight="700" fill="#0070c0" text-anchor="start">按记录属性批量开放</text>
  <rect x="378.419" y="230.667" width="330.419" height="76.667" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
  <text x="387.419" y="272.6" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">基于条件的共享规则</text>
  <rect x="708.837" y="230.667" width="523.163" height="76.667" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
  <text x="717.837" y="272.6" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">以记录字段条件选择记录，再授权给配置的接收方</text>
  <rect x="48" y="307.333" width="330.419" height="76.667" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
  <text x="57" y="349.267" font-family="微软雅黑" font-size="12" font-weight="700" fill="#0070c0" text-anchor="start">维护跨角色的接收方</text>
  <rect x="378.419" y="307.333" width="330.419" height="76.667" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="387.419" y="349.267" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">公共组</text>
  <rect x="708.837" y="307.333" width="523.163" height="76.667" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="717.837" y="349.267" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">组织用户、角色、区域或其他组，供共享配置引用</text>
  <rect x="48" y="384" width="330.419" height="76.667" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
  <text x="57" y="425.933" font-family="微软雅黑" font-size="12" font-weight="700" fill="#0070c0" text-anchor="start">为单笔业务建立协作</text>
  <rect x="378.419" y="384" width="330.419" height="76.667" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
  <text x="387.419" y="425.933" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">账户、商机或案例团队</text>
  <rect x="708.837" y="384" width="523.163" height="76.667" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
  <text x="717.837" y="425.933" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">为记录指定团队成员及只读或读写访问</text>
  <rect x="48" y="460.667" width="330.419" height="76.667" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
  <text x="57" y="502.6" font-family="微软雅黑" font-size="12" font-weight="700" fill="#0070c0" text-anchor="start">处理单笔临时例外</text>
  <rect x="378.419" y="460.667" width="330.419" height="76.667" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="387.419" y="502.6" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">手工共享</text>
  <rect x="708.837" y="460.667" width="523.163" height="76.667" rx="0" fill="#f6f7f8" stroke="#dde1e5" stroke-width="1" />
  <text x="717.837" y="502.6" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">可向指定用户、组或角色授权，转移所有权时需复核</text>
  <rect x="48" y="537.333" width="330.419" height="76.667" rx="0" fill="#eff5fb" stroke="#dde1e5" stroke-width="1" />
  <text x="57" y="579.267" font-family="微软雅黑" font-size="12" font-weight="700" fill="#0070c0" text-anchor="start">处理动态授权</text>
  <rect x="378.419" y="537.333" width="330.419" height="76.667" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
  <text x="387.419" y="579.267" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">Apex 程序化共享</text>
  <rect x="708.837" y="537.333" width="523.163" height="76.667" rx="0" fill="#ffffff" stroke="#dde1e5" stroke-width="1" />
  <text x="717.837" y="579.267" font-family="微软雅黑" font-size="12" font-weight="400" fill="#24292f" text-anchor="start">适合复杂规则或由外部系统维护的访问分配</text>
</svg>